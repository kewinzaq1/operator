services:
  - type: web
    name: operator
    runtime: ruby
    plan: starter
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec thrust bin/rails server"
    healthCheckPath: /up
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: OPERATOR_PACE
        value: "0.7"
      - key: SOLID_QUEUE_IN_PUMA
        value: "true"
      - key: APP_HOST
        sync: false
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: RAILS_MASTER_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: operator-db
          property: connectionString
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: LINQ_API_TOKEN
        sync: false
      - key: LINQ_PHONE_NUMBER
        sync: false
      - key: TERAC_API_KEY
        sync: false
      - key: BAND_API_KEY
        sync: false
      - key: BAND_CHAT_ID
        sync: false
      - key: SUPERSERVE_API_KEY
        sync: false
      - key: SUPERSERVE_BASE_URL
        sync: false
      - key: WHOP_API_KEY
        sync: false
      - key: WHOP_COMPANY_ID
        sync: false
      - key: REPLAY_QA_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

databases:
  - name: operator-db
    plan: basic-256mb
